<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#06121f"/>
      <stop offset="55%" stop-color="#030a12"/>
      <stop offset="100%" stop-color="#01040a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- ambient core glow -->
  <ellipse cx="800" cy="430" rx="520" ry="360" fill="url(#core)" opacity="0.35" filter="url(#soft)"/>

  <!-- circuit grid -->
  <g stroke="#0e7490" stroke-width="0.6" opacity="0.10">
    <g>
      <line x1="0" y1="150" x2="1600" y2="150"/>
      <line x1="0" y1="300" x2="1600" y2="300"/>
      <line x1="0" y1="450" x2="1600" y2="450"/>
      <line x1="0" y1="600" x2="1600" y2="600"/>
      <line x1="0" y1="750" x2="1600" y2="750"/>
      <line x1="200" y1="0" x2="200" y2="900"/>
      <line x1="400" y1="0" x2="400" y2="900"/>
      <line x1="600" y1="0" x2="600" y2="900"/>
      <line x1="800" y1="0" x2="800" y2="900"/>
      <line x1="1000" y1="0" x2="1000" y2="900"/>
      <line x1="1200" y1="0" x2="1200" y2="900"/>
      <line x1="1400" y1="0" x2="1400" y2="900"/>
    </g>
  </g>

  <!-- cyborg brain silhouette -->
  <g transform="translate(800 430)" filter="url(#glow)">
    <!-- outer brain hemispheres -->
    <path d="M -10 -200
             C -120 -210 -250 -150 -270 -40
             C -300 -30 -310 30 -270 60
             C -290 130 -200 200 -90 195
             C -60 215 30 215 60 195
             C 170 205 270 130 250 55
             C 300 25 290 -35 255 -45
             C 240 -155 110 -210 -10 -200 Z"
          fill="none" stroke="url(#trace)" stroke-width="2.4" opacity="0.85"/>
    <!-- central fissure -->
    <path d="M -10 -195 C -10 -120 -10 80 -10 190" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
    <!-- left gyri -->
    <g fill="none" stroke="url(#trace)" stroke-width="1.6" opacity="0.55">
      <path d="M -30 -160 C -110 -160 -150 -110 -120 -70 C -180 -70 -190 -10 -150 10 C -190 50 -150 120 -80 120"/>
      <path d="M -60 -120 C -120 -110 -130 -60 -95 -45 C -140 -25 -130 25 -90 35"/>
      <path d="M -50 -60 C -100 -55 -100 -10 -70 5"/>
    </g>
    <!-- right gyri -->
    <g fill="none" stroke="url(#trace)" stroke-width="1.6" opacity="0.55">
      <path d="M 30 -160 C 110 -160 150 -110 120 -70 C 180 -70 190 -10 150 10 C 190 50 150 120 80 120"/>
      <path d="M 60 -120 C 120 -110 130 -60 95 -45 C 140 -25 130 25 90 35"/>
      <path d="M 50 -60 C 100 -55 100 -10 70 5"/>
    </g>

    <!-- neural core -->
    <circle cx="0" cy="-10" r="20" fill="#5eead4" opacity="0.9"/>
    <circle cx="0" cy="-10" r="38" fill="none" stroke="#5eead4" stroke-width="1.4" opacity="0.5"/>

    <!-- synapse nodes -->
    <g fill="#67e8f9">
      <circle cx="-150" cy="-110" r="4"/><circle cx="-200" cy="-10" r="4"/>
      <circle cx="-130" cy="100" r="4"/><circle cx="150" cy="-110" r="4"/>
      <circle cx="200" cy="-10" r="4"/><circle cx="130" cy="100" r="4"/>
      <circle cx="-70" cy="-150" r="3"/><circle cx="70" cy="-150" r="3"/>
      <circle cx="-90" cy="160" r="3"/><circle cx="90" cy="160" r="3"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="-90" cy="-50" r="3"/><circle cx="90" cy="-50" r="3"/>
      <circle cx="-60" cy="60" r="3"/><circle cx="60" cy="60" r="3"/>
    </g>
  </g>

  <!-- descending data traces (circuit legs) -->
  <g stroke="url(#trace)" stroke-width="1.6" fill="none" opacity="0.4">
    <path d="M 720 620 L 720 760 L 640 760 L 640 860"/>
    <path d="M 880 620 L 880 720 L 960 720 L 960 860"/>
    <path d="M 800 640 L 800 880"/>
    <path d="M 560 540 L 360 540 L 360 700 L 240 700"/>
    <path d="M 1040 540 L 1240 540 L 1240 700 L 1360 700"/>
  </g>
  <g fill="#22d3ee" opacity="0.6">
    <circle cx="640" cy="860" r="4"/><circle cx="960" cy="860" r="4"/>
    <circle cx="800" cy="880" r="4"/><circle cx="240" cy="700" r="4"/>
    <circle cx="1360" cy="700" r="4"/>
  </g>

  <!-- vignette -->
  <rect width="1600" height="900" fill="url(#bg)" opacity="0.0"/>
</svg>
