services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tradebot-postgres
    environment:
      TZ: Africa/Johannesburg
      POSTGRES_USER: tradebot
      POSTGRES_PASSWORD: tradebot_password
      POSTGRES_DB: tradebot
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tradebot-redis
    environment:
      TZ: Africa/Johannesburg
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradebot-backend
    env_file:
      - .env
    environment:
      TZ: Africa/Johannesburg
      PYTHONPATH: /app:/
      START_WORKERS_IN_API: "false"
      HEADROOM_PROXY_URL: http://headroom-proxy:8787
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/app
      - ./plugins:/plugins
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      headroom-proxy:
        condition: service_started
    restart: unless-stopped

  # Dedicated worker runtime (scheduler + trading loops)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradebot-worker
    env_file:
      - .env
    environment:
      TZ: Africa/Johannesburg
      PYTHONPATH: /app:/
      START_WORKERS_IN_API: "true"
      HEADROOM_PROXY_URL: http://headroom-proxy:8787
    command: ["python", "-m", "app.workers.runner"]
    volumes:
      - ./backend:/app
      - ./plugins:/plugins
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      headroom-proxy:
        condition: service_started
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradebot-frontend
    environment:
      - TZ=Africa/Johannesburg
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
      - worker
    restart: unless-stopped

# OpenWA WhatsApp Gateway (optional - enable with --profile whatsapp)
  openwa-gateway:
    build:
      context: ./docker
      dockerfile: Dockerfile.openwa
    container_name: tradebot-openwa
    profiles: ["whatsapp"]
    environment:
      TZ: Africa/Johannesburg
      ENGINE_TYPE: whatsapp-web.js
      DATABASE_URL: sqlite:///data/openwa.db
      REDIS_URL: redis://redis:6379/1
      API_KEY: ${OPENWA_API_KEY:-changeme}
      SESSIONS_DIR: /data/sessions
      LOG_LEVEL: info
      SERVE_DASHBOARD: "true"
    ports:
      - "2785:8002"
      - "2886:2886"
    volumes:
      - ./data/openwa:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

# Headroom Proxy (token compression for AI requests)
  headroom-proxy:
    build:
      context: ./docker
      dockerfile: Dockerfile.headroom
    container_name: tradebot-headroom
    env_file:
      - .env
    environment:
      TZ: Africa/Johannesburg
      HEADROOM_OPENAI_API_KEY: ${HEADROOM_OPENAI_API_KEY:-${NVIDIA_API_KEY}}
      HEADROOM_OPENAI_BASE_URL: https://integrate.api.nvidia.com/v1
      HEADROOM_HOST: 0.0.0.0
      HEADROOM_PORT: 8787
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  openwa_data:
